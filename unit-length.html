<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./unit-length.css" />
</head>
<body>
    <!-- 
    em 
    - Unit length yang diperuntukan font size
    - Ukurannya relative terhadap parent nya 
    -->
    <div>
        <p>
            Hello, world!
        </p>
    </div>

    <!-- 
        rem 
        - Unit length yang diperuntukan font size 
        - Ukurannya relative terhadap root nya (<html>)
    -->
    <div id="section-02">
        <h3>Hello, world!</h3>
    </div>

    <!-- <div id="section-03">
        <h2>Hello</h2>
        <div id="section-03-01">
            <h2>Javascript</h2>
            <div>
                <h2>Hello</h2>
            </div>
        </div>
    </div> -->

    <!-- 
    vw (viewport width)
    - Ukurannya 1% terdapat lebar layar

    vh (viewport height)
    - Ukurannya 1% terhadap tinggi layar
    -->
    <div id="section-04">
        Hello
    </div>

    <!-- 
    vmin
    Nilai 1% dari dimensi layar yang lebih kecil (di antara width atau height). Contoh: pada layar 

    vmax
    Nilai 1% dari dimensi layar yang lebih besar (di antara width atau height). Contoh: pada layar 
    -->
    <h5>Hello</h5>
</body>
</html>
